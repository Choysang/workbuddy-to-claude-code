<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="420" fill="#eef1f5"/>
  <!-- window -->
  <rect x="60" y="40" width="600" height="340" rx="10" fill="#fff" stroke="#c9d0d8"/>
  <rect x="60" y="40" width="600" height="44" rx="10" fill="#f5f7fa"/>
  <text x="84" y="68" font-size="15" fill="#333" font-weight="bold">设置</text>
  <!-- sidebar -->
  <rect x="60" y="84" width="150" height="296" fill="#f7f9fb"/>
  <text x="84" y="120" font-size="13" fill="#667">通用</text>
  <text x="84" y="152" font-size="13" fill="#667">模型</text>
  <text x="84" y="184" font-size="13" fill="#667">工具</text>
  <rect x="70" y="198" width="130" height="28" rx="6" fill="#e3e9ff"/>
  <text x="84" y="217" font-size="13" fill="#3b4bdc" font-weight="bold">MCP / 连接器</text>
  <text x="84" y="252" font-size="13" fill="#667">高级</text>
  <!-- content -->
  <text x="240" y="130" font-size="14" fill="#333" font-weight="bold">自定义 MCP</text>
  <text x="240" y="152" font-size="12" fill="#889">统一控制用户自行添加的 MCP Server（context7 / agentmemory / headroom 挂在这里）</text>
  <!-- toggle on -->
  <rect x="560" y="118" width="56" height="28" rx="14" fill="#3b4bdc"/>
  <circle cx="602" cy="132" r="11" fill="#fff"/>
  <text x="574" y="137" font-size="11" fill="#fff">开</text>
  <!-- callout -->
  <circle cx="640" cy="108" r="16" fill="#c0392b"/>
  <text x="634" y="114" font-size="16" fill="#fff" font-weight="bold">1</text>
  <!-- note row -->
  <line x1="240" y1="180" x2="620" y2="180" stroke="#e4e8ee"/>
  <text x="240" y="212" font-size="13" fill="#333">此开关关闭时，所有自定义 MCP 都不会启动 —— 日志里连启动记录都没有</text>
  <text x="24" y="404" font-size="12" fill="#889">示意图：实际界面以你的 WorkBuddy 版本为准</text>
</svg>
